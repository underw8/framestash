<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>igd.</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <header>
    <span class="wordmark">igd<i></i></span>
    <span class="tagline">Instagram downloader</span>
  </header>

  <h2>Collection folder</h2>
  <section class="card folder">
    <span class="folder-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>
    </span>
    <span class="folder-text">
      <span id="folder" class="folder-name">No folder chosen</span>
      <span id="folderHint" class="hint">Pick the folder that holds your account folders.</span>
    </span>
    <span class="folder-actions">
      <button id="grant" class="primary" type="button" hidden>Allow access</button>
      <button id="pick" type="button">Choose</button>
    </span>
  </section>

  <h2>Queue profiles</h2>
  <section class="card">
    <textarea id="usernames" rows="4" placeholder="Usernames or profile links" spellcheck="false"></textarea>
    <p class="hint field-hint">One per line. Each runs as its own job.</p>
    <label class="switch-row"><span>Posts</span><input type="checkbox" id="withPosts" role="switch" checked><span class="switch" aria-hidden="true"></span></label>
    <label class="switch-row"><span>Stories &amp; highlights</span><input type="checkbox" id="withStories" role="switch"><span class="switch" aria-hidden="true"></span></label>
    <button id="add" class="primary wide" type="button">Add to queue</button>
  </section>

  <h2>Jobs</h2>
  <section class="card jobs-card">
    <p id="empty" class="hint">Nothing yet. Use the download buttons on Instagram, or queue profiles above.</p>
    <ol id="jobs"></ol>
  </section>

  <template id="jobRow">
    <li><span class="job-icon"><svg viewBox="0 0 24 24" aria-hidden="true"></svg></span>
      <span class="job-text"><span class="job-label"></span><span class="job-detail"></span></span></li>
  </template>

  <button id="check" class="wide" type="button">Check collection</button>
  <details id="reportBox" class="card" hidden><summary>Collection report</summary><pre id="report"></pre></details>

  <script src="naming.js"></script>
  <script src="collection.js"></script>
  <script src="manager.js"></script>
</body>
</html>
